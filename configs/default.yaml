# Default configuration for Culture-Geo experiments
# Override via CLI: python script.py key=value

model:
  name: "meta-llama/Meta-Llama-3-8B"
  dtype: "bfloat16"
  device: "cuda"
  max_length: 128
  batch_size: 8

# Multi-model registry
models:
  llama-3-8b:
    hf_name: "meta-llama/Meta-Llama-3-8B"
    short_name: "Llama-3-8B"
    layers: 32
    d_model: 4096
    vocab_size: 128256
    dtype: "bfloat16"
  llama-3-8b-instruct:
    hf_name: "meta-llama/Meta-Llama-3-8B-Instruct"
    short_name: "Llama-3-8B-IT"
    layers: 32
    d_model: 4096
    vocab_size: 128256
    dtype: "bfloat16"
  mistral-7b:
    hf_name: "mistralai/Mistral-7B-v0.3"
    short_name: "Mistral-7B"
    layers: 32
    d_model: 4096
    vocab_size: 32768
    dtype: "bfloat16"
  qwen-2.5-7b:
    hf_name: "Qwen/Qwen2.5-7B"
    short_name: "Qwen2.5-7B"
    layers: 28
    d_model: 3584
    vocab_size: 152064
    dtype: "bfloat16"

default_model: "llama-3-8b"

data:
  num_concepts_per_language: 20
  num_prompt_templates: 3
  seed: 42

extraction:
  layers: "all"  # or list of specific layer indices
  include_embeddings: true
  include_attention: false
  output_dir: "data/activations"
  compress: true

analysis:
  pca_components: 50
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  umap_n_components: 2
  kmeans_k: 10
  silhouette_samples: 10

visualization:
  figsize: [10, 8]
  dpi: 300
  style: "seaborn-v0_8-whitegrid"
  palette: "Set2"
  output_dir: "paper/figures"

modal:
  gpu: "L4"
  timeout: 3600
  image: "debian_slim"
